name: images
# Publishes prebuilt images so a new server pulls in seconds instead of building OBS for minutes.
# Use them with KEEL_IMAGE_PREFIX=ghcr.io/<owner>/keel KEEL_IMAGE_TAG=latest (see stack/docker-compose.yml).
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - name: controller
            context: controller
          - name: obs
            context: stack/obs
          - name: srtla
            context: stack/srtla
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: echo "prefix=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/keel" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ${{ steps.meta.outputs.prefix }}-${{ matrix.name }}:latest
            ${{ steps.meta.outputs.prefix }}-${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
